<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watchnow</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="login-container">
        <div class="logo">
          <div class="logo-icon">👁</div>
          <h1>Watchnow</h1>
          <p>Live camera & location viewer</p>
        </div>
        <button id="google-login-btn" class="btn btn-primary">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
          Continue with Google
        </button>
        <p class="note">Use the same Google account on both phones</p>
      </div>
    </div>

    <!-- Device List Screen -->
    <div id="devices-screen" class="screen hidden">
      <header class="app-header">
        <h2>Watchnow</h2>
        <button id="logout-btn" class="btn-icon" title="Logout">⎋</button>
      </header>

      <div class="content">
        <div class="section-title">Your Remote Devices</div>
        <div id="devices-list" class="devices-list">
          <div class="empty-state" id="empty-state">
            <p>No devices found</p>
            <small>Install HomeLook on another phone and login with the same Google account</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Live Viewer Screen -->
    <div id="viewer-screen" class="screen hidden">
      <header class="app-header viewer-header">
        <button id="back-btn" class="btn-icon">←</button>
        <h2 id="viewer-title">Live View</h2>
        <div class="header-actions">
          <button id="switch-camera-btn" class="btn-icon" title="Switch Camera">🔄</button>
          <button id="flashlight-btn" class="btn-icon" title="Flashlight">💡</button>
        </div>
      </header>

      <div class="viewer-container">
        <video id="remote-video" autoplay playsinline muted></video>
        <div id="no-stream" class="no-stream">
          <p>Connecting...</p>
        </div>
      </div>

      <div class="controls-bar">
        <button id="mic-btn" class="control-btn" title="Hold to talk">🎤</button>
        <button id="location-btn" class="control-btn" title="Show Location">📍</button>
        <button id="camera-off-btn" class="control-btn" title="Camera Off">📷</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
